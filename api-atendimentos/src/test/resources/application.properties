# Valores só para testes. A porta 1 nunca tem servidor: nenhum teste alcança uma api-conhecimento real.
spring.ai.mcp.client.streamable-http.connections.conhecimento.url=http://localhost:1
# O starter de MCP Server está no classpath de teste só para o FakeMcpServer; a aplicação não o usa.
spring.ai.mcp.server.enabled=false
# Chave fictícia: a OpenAI real nunca é chamada nos testes (Art. 14).
spring.ai.openai.api-key=test-key
